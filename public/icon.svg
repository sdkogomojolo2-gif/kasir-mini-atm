<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Royal Blue Gradient Background -->
    <linearGradient id="bgBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="55%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <!-- Soft Sky Blue Inner Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <!-- ATM Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <!-- Gold Chip Gradient -->
    <linearGradient id="goldChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgBlue)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Top Thermal Receipt Paper Emerging from EDC Machine -->
  <path d="M168 112 L168 48 L188 60 L208 48 L228 60 L248 48 L268 60 L288 48 L304 60 L304 112 Z" fill="#ffffff" stroke="#bfdbfe" stroke-width="5" stroke-linejoin="round"/>
  <line x1="188" y1="74" x2="284" y2="74" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
  <line x1="188" y1="90" x2="256" y2="90" stroke="#93c5fd" stroke-width="5" stroke-linecap="round"/>

  <!-- Main White EDC / Mini ATM Terminal Body -->
  <rect x="116" y="96" width="240" height="332" rx="36" fill="#ffffff" stroke="#dbeafe" stroke-width="8"/>
  <!-- Top Card Reader Slot on EDC -->
  <rect x="152" y="108" width="168" height="10" rx="5" fill="#1e3a8a"/>

  <!-- EDC Blue Framed Display Screen -->
  <rect x="140" y="132" width="192" height="106" rx="18" fill="url(#screenGrad)" stroke="#2563eb" stroke-width="6"/>
  <!-- Top Status Bar inside Screen -->
  <rect x="154" y="144" width="164" height="22" rx="6" fill="#1d4ed8"/>
  <text x="236" y="159" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">MINI ATM-Q</text>

  <!-- Main Screen Text -->
  <text x="236" y="196" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#1e3a8a" text-anchor="middle" letter-spacing="0.5">ATM &amp; EDC</text>
  <text x="236" y="220" font-family="JetBrains Mono, monospace" font-size="13" font-weight="800" fill="#2563eb" text-anchor="middle">TRANSFER • TARIK TUNAI</text>

  <!-- EDC Keypad Grid (3x3 + Action Row) -->
  <!-- Row 1 -->
  <rect x="144" y="256" width="52" height="28" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <rect x="210" y="256" width="52" height="28" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <rect x="276" y="256" width="52" height="28" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <!-- Row 2 -->
  <rect x="144" y="296" width="52" height="28" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <rect x="210" y="296" width="52" height="28" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <rect x="276" y="296" width="52" height="28" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <!-- Row 3 -->
  <rect x="144" y="336" width="52" height="28" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <rect x="210" y="336" width="52" height="28" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <rect x="276" y="336" width="52" height="28" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <!-- Row 4: Cancel (Red), Clear (Yellow), Enter (Green/Blue) -->
  <rect x="144" y="376" width="52" height="30" rx="8" fill="#ef4444"/>
  <rect x="210" y="376" width="52" height="30" rx="8" fill="#f59e0b"/>
  <rect x="276" y="376" width="52" height="30" rx="8" fill="#10b981"/>

  <!-- Overlapping Bank ATM Card on Right Side -->
  <g transform="translate(268, 250) rotate(-10)">
    <rect x="0" y="0" width="164" height="196" rx="22" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="8"/>
    <!-- Magnetic Stripe / Card Accent -->
    <rect x="24" y="26" width="54" height="42" rx="8" fill="url(#goldChip)" stroke="#ca8a04" stroke-width="2"/>
    <!-- Chip Lines -->
    <line x1="24" y1="47" x2="78" y2="47" stroke="#a16207" stroke-width="2"/>
    <line x1="51" y1="26" x2="51" y2="68" stroke="#a16207" stroke-width="2"/>
    <!-- Contactless NFC Waves -->
    <path d="M112 36 A16 16 0 0 1 112 58" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M120 30 A24 24 0 0 1 120 64" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Card Number Dots & Label -->
    <rect x="24" y="92" width="116" height="10" rx="5" fill="#e0f2fe" opacity="0.9"/>
    <rect x="24" y="114" width="80" height="10" rx="5" fill="#bae6fd" opacity="0.75"/>
    <rect x="24" y="146" width="116" height="28" rx="8" fill="#ffffff"/>
    <text x="82" y="165" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#0369a1" text-anchor="middle" letter-spacing="1">CARD / ATM</text>
  </g>
</svg>
