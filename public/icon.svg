<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background with safe padding for maskable -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  
  <!-- Cash Register / POS Stylized Icon -->
  <g transform="translate(80, 80) scale(0.6875)">
    <!-- Base / Cash Drawer -->
    <rect x="30" y="320" width="452" height="130" rx="24" fill="#064e3b" stroke="#34d399" stroke-width="12"/>
    <!-- Drawer Lock & Handle -->
    <circle cx="256" cy="385" r="16" fill="#fbbf24"/>
    <rect x="180" y="380" width="152" height="10" rx="5" fill="#34d399" opacity="0.6"/>

    <!-- Main Register Body -->
    <path d="M70 320 L110 130 C114 110 132 96 152 96 L360 96 C380 96 398 110 402 130 L442 320 Z" fill="#0f172a" stroke="#34d399" stroke-width="12"/>

    <!-- Screen / Display -->
    <rect x="120" y="125" width="272" height="105" rx="18" fill="#064e3b" stroke="#34d399" stroke-width="6"/>
    <rect x="128" y="133" width="256" height="89" rx="14" fill="#10b981"/>
    <text x="256" y="175" font-family="Plus Jakarta Sans, system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#064e3b" text-anchor="middle" letter-spacing="1">Kasir-Q</text>
    <text x="256" y="202" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">POS &amp; TOKO</text>

    <!-- Keypad Buttons -->
    <circle cx="160" cy="270" r="14" fill="#34d399"/>
    <circle cx="208" cy="270" r="14" fill="#34d399"/>
    <circle cx="256" cy="270" r="14" fill="#34d399"/>
    <circle cx="304" cy="270" r="14" fill="#34d399"/>
    <circle cx="352" cy="270" r="14" fill="#f59e0b"/>

    <!-- Receipt Paper Coming Out from Top -->
    <path d="M200 96 L200 30 L220 45 L240 30 L260 45 L280 30 L300 45 L312 30 L312 96 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="6"/>
    <!-- Lines on Receipt -->
    <line x1="216" y1="56" x2="296" y2="56" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="216" y1="72" x2="276" y2="72" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
